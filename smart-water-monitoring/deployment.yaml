
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-water-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-water-monitoring
  template:
    metadata:
      labels:
        app: smart-water-monitoring
    spec:
      containers:
        - name: water-dashboard
          image: jaivea/smart-water-monitoring:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-water-monitoring-service
spec:
  type: NodePort
  selector:
    app: smart-water-monitoring
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
